// ============ DROPBOX CLIENT ============
// PKCE OAuth flow + read/write of the CSV file.
// No server, no client secret — the token sits in localStorage.

const DBX = (() => {
  const TOKEN_KEY = 'dbx_token';
  const VERIFIER_KEY = 'dbx_pkce_verifier';
  const REFRESH_KEY = 'dbx_refresh_token';
  const EXPIRES_KEY = 'dbx_expires_at';

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function getRefreshToken() { return localStorage.getItem(REFRESH_KEY); }
  function isExpired() {
    const exp = parseInt(localStorage.getItem(EXPIRES_KEY) || '0', 10);
    return !exp || Date.now() > exp - 60000; // 1min skew
  }
  function setTokens({ access_token, refresh_token, expires_in }) {
    localStorage.setItem(TOKEN_KEY, access_token);
    if (refresh_token) localStorage.setItem(REFRESH_KEY, refresh_token);
    if (expires_in) localStorage.setItem(EXPIRES_KEY, String(Date.now() + expires_in * 1000));
  }
  function clearTokens() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(REFRESH_KEY);
    localStorage.removeItem(EXPIRES_KEY);
    localStorage.removeItem(VERIFIER_KEY);
  }

  // PKCE: generate a verifier + challenge pair
  function base64UrlEncode(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function sha256(text) {
    const enc = new TextEncoder().encode(text);
    return await crypto.subtle.digest('SHA-256', enc);
  }
  function randomVerifier() {
    const arr = new Uint8Array(64);
    crypto.getRandomValues(arr);
    return base64UrlEncode(arr);
  }

  async function startAuth() {
    const verifier = randomVerifier();
    localStorage.setItem(VERIFIER_KEY, verifier);
    const challenge = base64UrlEncode(await sha256(verifier));
    const params = new URLSearchParams({
      client_id: DROPBOX_APP_KEY,
      response_type: 'code',
      redirect_uri: DROPBOX_REDIRECT_URI,
      code_challenge: challenge,
      code_challenge_method: 'S256',
      token_access_type: 'offline' // returns refresh_token
    });
    window.location.href = 'https://www.dropbox.com/oauth2/authorize?' + params.toString();
  }

  async function completeAuth(code) {
    const verifier = localStorage.getItem(VERIFIER_KEY);
    if (!verifier) throw new Error('Missing PKCE verifier');
    const body = new URLSearchParams({
      code,
      grant_type: 'authorization_code',
      client_id: DROPBOX_APP_KEY,
      redirect_uri: DROPBOX_REDIRECT_URI,
      code_verifier: verifier
    });
    const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    if (!res.ok) throw new Error('Token exchange failed: ' + await res.text());
    const json = await res.json();
    setTokens(json);
    localStorage.removeItem(VERIFIER_KEY);
  }

  async function refreshAccessToken() {
    const rt = getRefreshToken();
    if (!rt) throw new Error('No refresh token; need re-auth');
    const body = new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: rt,
      client_id: DROPBOX_APP_KEY
    });
    const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    if (!res.ok) {
      clearTokens(); // refresh failed, force re-auth
      throw new Error('Refresh failed: ' + await res.text());
    }
    const json = await res.json();
    setTokens(json);
  }

  async function ensureFreshToken() {
    if (!getToken()) throw new Error('Not authenticated');
    if (isExpired()) await refreshAccessToken();
  }

  async function downloadFile() {
    await ensureFreshToken();
    const res = await fetch('https://content.dropboxapi.com/2/files/download', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + getToken(),
        'Dropbox-API-Arg': JSON.stringify({ path: DROPBOX_FILE_PATH })
      }
    });
    if (res.status === 409) {
      // File doesn't exist yet — treat as empty
      return '';
    }
    if (!res.ok) throw new Error('Download failed (' + res.status + '): ' + await res.text());
    return await res.text();
  }

  async function uploadFile(content) {
    await ensureFreshToken();
    const res = await fetch('https://content.dropboxapi.com/2/files/upload', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + getToken(),
        'Content-Type': 'application/octet-stream',
        'Dropbox-API-Arg': JSON.stringify({
          path: DROPBOX_FILE_PATH,
          mode: 'overwrite',
          autorename: false,
          mute: true
        })
      },
      body: new TextEncoder().encode(content)
    });
    if (!res.ok) throw new Error('Upload failed (' + res.status + '): ' + await res.text());
    return await res.json();
  }

  function isAuthenticated() {
    return !!getToken();
  }

  function signOut() {
    clearTokens();
    location.reload();
  }

  return { startAuth, completeAuth, downloadFile, uploadFile, isAuthenticated, signOut };
})();

// ============ INIT ============
(async function init() {
  // Handle Dropbox OAuth redirect: ?code=... in URL means we just came back from Dropbox
  const url = new URL(window.location.href);
  const code = url.searchParams.get('code');
  if (code) {
    try {
      await DBX.completeAuth(code);
      // Clean ?code= from URL so it doesn't trigger again on refresh
      history.replaceState(null, '', DROPBOX_REDIRECT_URI);
      await loadFromDropbox();
      return;
    } catch (e) {
      console.error('OAuth complete failed', e);
      alert('שגיאה בהתחברות ל-Dropbox: ' + e.message);
    }
  }

  // Already authenticated → load fresh from Dropbox
  if (DBX.isAuthenticated()) {
    try {
      await loadFromDropbox();
      return;
    } catch (e) {
      console.warn('Dropbox load failed, showing connect screen', e);
      // Fall through to welcome screen
    }
  }

  // Legacy iOS Shortcut hash path — still works if someone launches via View Expenses
  const loaded = loadFromHash();
  if (loaded !== null) {
    transactions = loaded;
    dataLoaded = true;
    const updated = backfillCategories();
    if (updated > 0) { dirty = true; showToast(`מולאו ${updated} קטגוריות אוטומטית`); }
    render();
    return;
  }

  // Not authenticated and no hash data: show the Dropbox connect screen
  renderConnectWelcome();
})();
